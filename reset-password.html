<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drape & Aura — Reset Password</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="screen-center">
  <div class="auth-card">
    <div class="brand-mark">✧</div>
    <p class="eyebrow">DRAPE & AURA</p>
    <h1>Set New Password</h1>
    <form id="resetForm">
      <label>New Password<input id="newPassword" type="password" minlength="6" required></label>
      <button class="primary" type="submit">Update Password</button>
      <p id="resetError" class="error"></p>
      <p id="resetSuccess" class="success hidden">Password updated. <a href="admin.html">Sign in</a></p>
    </form>
  </div>
</div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const { createClient } = window.supabase;
const supabase = createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
const $ = (id) => document.getElementById(id);

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('resetError').textContent = '';
  const { error } = await supabase.auth.updateUser({ password: $('newPassword').value });
  if (error) {
    $('resetError').textContent = error.message;
  } else {
    document.getElementById('resetForm').querySelector('button').style.display = 'none';
    $('newPassword').style.display = 'none';
    $('resetSuccess').classList.remove('hidden');
  }
});
</script>
</body>
</html>
